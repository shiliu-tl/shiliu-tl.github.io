<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待输入</title>
<meta name="description" content="待输入展示自己开发的游戏">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2937;
    background: #f8fafc;
    line-height: 1.6;
  }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }
  img { max-width: 100%; display: block; border-radius: 12px; }

  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  header {
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #e2e8f0;
    z-index: 100;
  }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }
  .logo { font-size: 20px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { font-size: 14px; color: #64748b; font-weight: 500; }
  .nav-links a:hover { color: #2563eb; }

  .hero { padding: 100px 20px 60px; text-align: center; }
  .hero .tag {
    display: inline-block;
    padding: 6px 14px;
    background: #dbeafe;
    color: #2563eb;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .hero h1 { font-size: 40px; color: #0f172a; margin-bottom: 16px; line-height: 1.2; }
  .hero p { font-size: 17px; color: #64748b; max-width: 560px; margin: 0 auto 30px; }

  .works { padding: 60px 20px; }
  .works h2 { font-size: 24px; color: #0f172a; margin-bottom: 30px; text-align: center; }
  .works-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -6px rgb(0 0 0 / 0.08); }
  .card-thumb { height: 160px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; }
  .card-body { padding: 20px; }
  .card-tags { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .card-tags span {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 6px;
    background: #eff6ff;
    color: #2563eb;
    font-weight: 700;
  }
  .card h3 { font-size: 17px; margin-bottom: 8px; color: #0f172a; }
  .card p { font-size: 14px; color: #64748b; margin-bottom: 16px; }
  .card .btn {
    display: inline-block;
    padding: 8px 16px;
    background: #0f172a;
    color: #fff;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .card .btn:hover { background: #2563eb; }

  .about { padding: 60px 20px; background: #fff; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .about-text h3 { font-size: 22px; color: #0f172a; margin-bottom: 12px; }
  .about-text p { color: #64748b; font-size: 15px; margin-bottom: 12px; }
  .about-img { height: 300px; background: #f1f5f9; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; }

  .contact { padding: 60px 20px; text-align: center; }
  .contact h3 { font-size: 22px; color: #0f172a; margin-bottom: 10px; }
  .contact p { color: #64748b; margin-bottom: 24px; }
  .contact-links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .contact-links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: 14px;
    color: #334155;
    background: #fff;
  }
  .contact-links a:hover { border-color: #2563eb; color: #2563eb; }

  footer { padding: 30px 20px; text-align: center; color: #94a3b8; font-size: 13px; border-top: 1px solid #e2e8f0; }

  @media (max-width: 640px) {
    .hero h1 { font-size: 30px; }
    .about-grid { grid-template-columns: 1fr; }
    .nav-links { display: none; }
  }
</style>
</head>
